<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Ilha Brava</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* tela de carregamento: aparece na hora, antes do JavaScript e do 3D */
      #boot { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(#f6b16a 0%, #f08a5d 38%, #3a8fb7 62%, #0e4f78 100%); font-family: system-ui, sans-serif; transition: opacity .5s; }
      #boot b { font-size: clamp(40px, 9vw, 72px); font-weight: 900; color: #fff8e6; text-shadow: 0 4px 0 #b4581f, 0 8px 0 #6e2f10, 0 14px 30px rgba(0,0,0,.45); }
      #boot i { width: 46px; height: 46px; border-radius: 50%; border: 5px solid rgba(255,255,255,.3); border-top-color: #fff; animation: bootspin 0.9s linear infinite; }
      #boot.out { opacity: 0; pointer-events: none; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><b>Ilha Brava</b><i></i></div>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="stats">
        <div class="bar hp"><i id="hp-bar"></i><span id="hp-text"></span></div>
        <div class="bar xp"><i id="xp-bar"></i><span id="lvl-text"></span></div>
        <div id="inv"></div>
      </div>
      <div id="quest"><div id="arrow">▲</div><div><b id="quest-title"></b><small id="quest-dist"></small></div></div>
      <div id="side">
        <canvas id="map" width="192" height="192"></canvas>
        <button id="btn-pause" class="round small">⏸</button>
      </div>
      <div id="stick" class="hidden"><i></i></div>
      <div id="pad">
        <button id="btn-use" class="pill hidden"></button>
        <div class="pad-row">
          <button id="btn-eat" class="round">🫐<i id="eat-n"></i></button>
          <button id="btn-roll" class="round">💨</button>
          <button id="btn-atk" class="round big">⚔️</button>
        </div>
      </div>
      <div id="dialog" class="hidden"><b id="dlg-who"></b><p id="dlg-text"></p><small>toque para continuar</small></div>
      <div id="shop" class="hidden">
        <div class="shop-head"><b>🧭 Loja do Capitão</b><span id="shop-coins"></span><button id="shop-close" class="round small">✕</button></div>
        <p id="shop-hint"></p>
        <div id="shop-list"></div>
        <button id="shop-ad" class="btn small">📺 Assistir anúncio: +25 🪙</button>
      </div>
      <div id="boss" class="hidden"><b>Golem da Montanha</b><div class="bar"><i id="boss-bar"></i></div></div>
    </div>
    <div id="floaters"></div>

    <div id="menu" class="screen">
      <div class="logo"><h1>Ilha Brava</h1><p>Sobreviva, construa e escape</p></div>
      <div class="menu-btns">
        <button id="btn-continue" class="btn big hidden">▶ Continuar</button>
        <button id="btn-new" class="btn big">Novo jogo</button>
        <div class="row"><button id="btn-sfx" class="btn small"></button><button id="btn-music" class="btn small"></button></div>
        <div class="row"><button id="btn-gfx" class="btn small"></button></div>
      </div>
    </div>

    <div id="pause" class="modal hidden"><div class="card">
      <h2>Pausado</h2>
      <p id="pause-info"></p>
      <div id="daily"><b>🗓️ Desafios de hoje</b><ul id="daily-list"></ul></div>
      <button id="btn-resume" class="btn big">▶ Continuar</button>
      <button id="btn-menu" class="btn gray">Sair para o menu</button>
    </div></div>

    <div id="death" class="modal hidden"><div class="card">
      <h2>Você caiu…</h2>
      <p>Voltar ao acampamento custa 30% das moedas.</p>
      <button id="btn-revive" class="btn orange">Reviver aqui (anúncio)</button>
      <button id="btn-respawn" class="btn big">Voltar ao acampamento</button>
    </div></div>

    <div id="ending" class="modal hidden"><div class="card">
      <h2>Você escapou da ilha! ⛵</h2>
      <p id="end-info"></p>
      <button id="btn-stay" class="btn big">Continuar explorando</button>
    </div></div>

    <div id="toast"></div>
    <div id="ad-sim"><b>ANÚNCIO (simulado)</b><span id="ad-sim-text"></span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
