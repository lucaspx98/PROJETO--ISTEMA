<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Ilha Brava</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="stats">
        <div class="bar hp"><i id="hp-bar"></i><span id="hp-text"></span></div>
        <div class="bar xp"><i id="xp-bar"></i><span id="lvl-text"></span></div>
        <div id="inv"></div>
      </div>
      <div id="quest"><div id="arrow">▲</div><div><b id="quest-title"></b><small id="quest-dist"></small></div></div>
      <div id="side">
        <canvas id="map" width="192" height="192"></canvas>
        <button id="btn-pause" class="round small">⏸</button>
      </div>
      <div id="stick" class="hidden"><i></i></div>
      <div id="pad">
        <button id="btn-use" class="pill hidden"></button>
        <div class="pad-row">
          <button id="btn-eat" class="round">🫐<i id="eat-n"></i></button>
          <button id="btn-roll" class="round">💨</button>
          <button id="btn-atk" class="round big">⚔️</button>
        </div>
      </div>
      <div id="dialog" class="hidden"><b id="dlg-who"></b><p id="dlg-text"></p><small>toque para continuar</small></div>
      <div id="boss" class="hidden"><b>Golem da Montanha</b><div class="bar"><i id="boss-bar"></i></div></div>
    </div>
    <div id="floaters"></div>

    <div id="menu" class="screen">
      <div class="logo"><h1>Ilha Brava</h1><p>Sobreviva, construa e escape</p></div>
      <div class="menu-btns">
        <button id="btn-continue" class="btn big hidden">▶ Continuar</button>
        <button id="btn-new" class="btn big">Novo jogo</button>
        <div class="row"><button id="btn-sfx" class="btn small"></button><button id="btn-music" class="btn small"></button></div>
      </div>
    </div>

    <div id="pause" class="modal hidden"><div class="card">
      <h2>Pausado</h2>
      <p id="pause-info"></p>
      <button id="btn-resume" class="btn big">▶ Continuar</button>
      <button id="btn-menu" class="btn gray">Sair para o menu</button>
    </div></div>

    <div id="death" class="modal hidden"><div class="card">
      <h2>Você caiu…</h2>
      <p>Voltar ao acampamento custa 30% das moedas.</p>
      <button id="btn-revive" class="btn orange">Reviver aqui (anúncio)</button>
      <button id="btn-respawn" class="btn big">Voltar ao acampamento</button>
    </div></div>

    <div id="ending" class="modal hidden"><div class="card">
      <h2>Você escapou da ilha! ⛵</h2>
      <p id="end-info"></p>
      <button id="btn-stay" class="btn big">Continuar explorando</button>
    </div></div>

    <div id="toast"></div>
    <div id="ad-sim"><b>ANÚNCIO (simulado)</b><span id="ad-sim-text"></span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
