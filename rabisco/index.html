<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc8ff" />
    <title>Risca e Salva</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="menu" class="screen">
      <div class="topbar"><span></span><span class="pill">🪙 <b class="coin-val">0</b></span></div>
      <div class="logo">
        <h1>Risca<br />e Salva</h1>
        <p>Desenhe um traço para proteger o Bolota!</p>
      </div>
      <div class="menu-bottom">
        <button id="btn-play" class="btn big">▶ Fase 1</button>
        <button id="btn-skins" class="btn lilac">🎨 Roupinhas</button>
        <div class="row">
          <button id="btn-sfx" class="btn small dark"></button>
          <button id="btn-music" class="btn small dark"></button>
        </div>
      </div>
    </div>

    <div id="skins" class="screen hidden">
      <div class="topbar">
        <button id="btn-skins-back" class="icon">←</button>
        <b class="title">🎨 Roupinhas</b>
        <span class="pill">🪙 <b class="coin-val">0</b></span>
      </div>
      <div id="skin-list"></div>
    </div>

    <div id="hud" class="hidden">
      <div class="topbar">
        <button id="btn-home" class="icon">⌂</button>
        <div class="lvl"><b id="lvl-name"></b><div class="ink"><i id="ink-bar"></i></div></div>
        <button id="btn-hint" class="icon hint">💡</button>
        <button id="btn-retry" class="icon">↻</button>
      </div>
      <div id="timer" class="hidden">10</div>
      <div id="draw-tip">Desenhe com o dedo para proteger o Bolota!</div>
    </div>

    <div id="win" class="modal hidden">
      <div class="card">
        <h2>Salvou! 🎉</h2>
        <div id="win-stars" class="stars"></div>
        <p class="reward">+<b id="win-coins">0</b> 🪙</p>
        <button id="btn-next" class="btn big">Próxima fase ▶</button>
        <button id="btn-double" class="btn orange">Dobrar moedas (anúncio)</button>
      </div>
    </div>

    <div id="lose" class="modal hidden">
      <div class="card">
        <h2 id="lose-title">Ai!</h2>
        <p>O Bolota não escapou dessa vez.</p>
        <button id="btn-again" class="btn big">↻ Tentar de novo</button>
        <button id="btn-lose-hint" class="btn orange">💡 Ver a dica</button>
        <button id="btn-skip" class="btn lilac">Pular fase (anúncio)</button>
      </div>
    </div>

    <div id="toast"></div>
    <div id="ad-sim"><b>ANÚNCIO (simulado)</b><span id="ad-sim-text"></span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
